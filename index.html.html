<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Center Ad - Auto Click</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f4f4;
        }
        .ad-box {
            width: 350px;
            height: 350px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .ad-box h1 { color: white; font-size: 28px; }
        .ad-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: white;
            color: #007bff;
            border-radius: 25px;
        }
    </style>
</head>
<body>
    <div class="ad-box" onclick="window.location.href='https://www.google.com'">
        <h1>Click & Visit</h1>
        <p>Go to Google Now 🚀</p>
        <div class="ad-btn">Click Here</div>
    </div>
    
    <script>
        setTimeout(function() {
            window.location.href = 'https://www.google.com';
        }, 1000);
    </script>
</body>
</html>
