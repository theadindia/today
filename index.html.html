<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="kadam-verification" content="kadam99f747d03417dff54a1144249567f799" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>350x350 Ad - 1 Microsecond Redirect</title>

<style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f4f4f4;
    margin: 0;
    padding: 0;
}

.ad-box {
    width: 350px;
    height: 350px;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: 0.3s;
    text-align: center;
}

.ad-box:hover {
    transform: scale(1.05);
}

.ad-box h1 {
    color: white;
    font-size: 28px;
    margin-bottom: 10px;
}

.ad-box p {
    color: white;
    font-size: 16px;
}

.ad-btn {
    margin-top: 15px;
    padding: 10px 20px;
    background: white;
    color: #007bff;
    border-radius: 25px;
    font-weight: bold;
}
</style>

</head>
<body>

<div class="ad-box" onclick="openAd()">
    <h1>Click & Visit</h1>
    <p>Go to Google Now 🚀</p>
    <div class="ad-btn">Click Here</div>
</div>

<script>
function openAd() {
    window.location.href = "https://www.google.com";
}

// Fastest redirect - 1 microsecond (0.001 milliseconds)
setTimeout(function() {
    window.location.href = "https://www.google.com";
}, 0.001);
</script>

</body>
</html>
