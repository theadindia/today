<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Center Ad</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f4f4;
            font-family: Arial, sans-serif;
        }
        
        .ad-wrapper {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Your original ad-box styling */
        .ad-box {
            width: 350px;
            height: 350px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
            text-align: center;
        }
        
        .ad-box:hover {
            transform: scale(1.05);
        }
        
        .ad-box h1 {
            color: white;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .ad-box p {
            color: white;
            font-size: 16px;
        }
        
        .ad-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: white;
            color: #007bff;
            border-radius: 25px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="ad-wrapper">
        <!-- Aapka diya hua ad code exactly yahan center mein laga diya -->
        <div class="ad-box" onclick="openAd()">
            <h1>Click & Visit</h1>
            <p>Go to Google Now 🚀</p>
            <div class="ad-btn">Click Here</div>
        </div>
    </div>
    
    <script>
    function openAd() {
        window.open("https://www.google.com", "_blank");
    }
    </script>
</body>
</html>
