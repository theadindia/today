<?php
// Single post template modification
function fast_grid_single_post_template() {
    if (is_singular('grid_post')) {
        ?>
        <article class="single-post-container">
            <div class="single-post-img-container">
                <?php if (has_post_thumbnail()): ?>
                    <img class="single-post-img" src="<?php the_post_thumbnail_url('large'); ?>" alt="<?php the_title_attribute(); ?>">
                <?php else: ?>
                    <img class="single-post-img" src="https://picsum.photos/id/100/800/450" alt="default">
                <?php endif; ?>
                <?php if (get_option('fast_grid_play_button', 1)): ?>
                <div class="single-post-play-overlay">
                    <div class="single-post-play-button">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                </div>
                <?php endif; ?>
            </div>
            <div class="single-post-content">
                <h1 class="single-post-title"><?php the_title(); ?></h1>
                <div class="single-post-meta">
                    <span>📅 <?php echo get_the_date(); ?></span>
                    <span>🆔 पोस्ट ID: <?php the_ID(); ?></span>
                    <span>🔗 URL: /post/<?php echo sanitize_title(get_the_title()); ?></span>
                </div>
                <div class="single-post-tags">
                    <?php
                    $hashtags = wp_get_post_terms(get_the_ID(), 'post_hashtag', array('fields' => 'names'));
                    foreach ($hashtags as $tag):
                    ?>
                        <span class="single-post-tag">#<?php echo esc_html($tag); ?></span>
                    <?php endforeach; ?>
                </div>
                <div class="single-post-description">
                    <?php the_content(); ?>
                </div>
                <a href="<?php echo home_url(); ?>" class="back-to-home">← सभी पोस्ट पर वापस जाएं</a>
            </div>
        </article>
        
        <style>
            .single-post-container {
                max-width: 900px;
                margin: 0 auto;
                background: white;
                border-radius: 32px;
                overflow: hidden;
                box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            }
            .single-post-img-container {
                position: relative;
                width: 100%;
                max-height: 450px;
                overflow: hidden;
                background: #0a0a0a;
            }
            .single-post-img {
                width: 100%;
                max-height: 450px;
                object-fit: cover;
                display: block;
            }
            .single-post-play-overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.4);
                display: flex;
                align-items: center;
                justify-content: center;
                pointer-events: none;
            }
            .single-post-play-button {
                width: 80px;
                height: 80px;
                background: rgba(255, 255, 255, 0.95);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            }
            .single-post-play-button svg {
                width: 40px;
                height: 40px;
                margin-left: 5px;
                fill: #3b82f6;
            }
            .single-post-content {
                padding: 40px 32px;
            }
            .single-post-title {
                font-size: 2.2rem;
                font-weight: 800;
                margin-bottom: 20px;
                color: #0f172a;
                line-height: 1.3;
            }
            .single-post-meta {
                display: flex;
                gap: 20px;
                flex-wrap: wrap;
                margin-bottom: 30px;
                padding-bottom: 20px;
                border-bottom: 1px solid #e2e8f0;
                color: #64748b;
                font-size: 0.85rem;
            }
            .single-post-tags {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin-bottom: 25px;
            }
            .single-post-tag {
                background: #eef2ff;
                color: #2563eb;
                padding: 6px 14px;
                border-radius: 40px;
                font-size: 0.8rem;
                font-weight: 500;
            }
            .single-post-description {
                font-size: 1.05rem;
                line-height: 1.7;
                color: #1e293b;
                white-space: pre-wrap;
                margin-bottom: 30px;
            }
            .back-to-home {
                display: inline-block;
                background: #f1f5f9;
                color: #1e293b;
                padding: 10px 24px;
                border-radius: 40px;
                text-decoration: none;
                font-weight: 500;
                margin-top: 20px;
                transition: 0.2s;
            }
            .back-to-home:hover {
                background: #e2e8f0;
            }
            @media (max-width: 640px) {
                .single-post-title { font-size: 1.6rem; }
                .single-post-content { padding: 24px 20px; }
            }
        </style>
        <?php
    }
}
add_action('wp_head', 'fast_grid_single_post_template');
